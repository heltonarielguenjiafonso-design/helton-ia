<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HELTON IA - Criada por Helton Afonso</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family: 'Inter', Segoe UI, sans-serif}
body{background:#0a0e1a;color:#e2e8f0;height:100vh;display:flex;flex-direction:column}
header{background:#111827;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1f2937}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#fff}
.brand h1{font-size:16px;font-weight:700}
.brand p{font-size:12px;color:#9ca3af}
#chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;background:#0a0e1a}
.msg{max-width:80%;padding:14px 18px;border-radius:16px;line-height:1.6;font-size:14.5px;white-space:pre-line}
.bot{background:#1f2937;align-self:flex-start;border:1px solid #2d3748}
.user{background:linear-gradient(135deg,#3b82f6,#6366f1);align-self:flex-end;color:#fff}
#inputArea{padding:16px;background:#111827;border-top:1px solid #1f2937;display:flex;gap:12px}
#inputArea input{flex:1;background:#1f2937;border:1px solid #2d3748;padding:14px 18px;border-radius:12px;color:#fff;outline:none;font-size:14px}
#inputArea button{background:#3b82f6;border:0;padding:12px 24px;border-radius:12px;color:#fff;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<header>
<div class="brand">
<div class="logo">H</div>
<div>
<h1>HELTON IA</h1>
<p>Criada por Helton Afonso • Luanda, Angola</p>
</div>
</div>
</header>
<div id="chat">
<div class="msg bot">Olá! Eu sou a HELTON IA, criada por Helton Afonso.

Sou uma inteligência artificial motivacional e educacional, desenvolvida em Luanda, Angola, com o propósito de ajudar estudantes, programadores e empreendedores.

Como posso te ajudar hoje?</div>
</div>
<div id="inputArea">
<input id="msgInput" placeholder="Digite sua pergunta..." onkeypress="if(event.key==='Enter')enviar()">
<button onclick="enviar()">Enviar</button>
</div>
<script>
const chat=document.getElementById('chat');
const input=document.getElementById('msgInput');
function addMsg(t,c){const d=document.createElement('div');d.className='msg '+c;d.innerText=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
function responder(p){
 p=p.toLowerCase();
 if(p.includes('quem')) return 'Eu sou a HELTON IA, criada por Helton Afonso, estudante e entusiasta de tecnologia de Luanda, Angola.\n\nFui desenvolvida para ajudar jovens angolanos com estudos, programação e desenvolvimento pessoal.';
 if(p.includes('helton')||p.includes('afonso')) return 'Helton Afonso é meu criador. Ele é estudante, criador de conteúdo e apaixonado por tecnologia. Acredita que a tecnologia pode transformar Angola e criou este projeto para compartilhar conhecimento.';
 if(p.includes('programa')||p.includes('codigo')||p.includes('python')||p.includes('javascript')) return 'Ótima escolha! A programação é o futuro.\n\nPara começar:\n1. Lógica de Programação\n2. HTML, CSS e JavaScript\n3. Python para iniciantes\n4. Git e GitHub\n5. Projetos práticos diários\n\nMe diga qual linguagem quer aprender que eu monto um plano para você.';
 if(p.includes('motiva')||p.includes('desanima')) return 'Todo grande programador já pensou em desistir no começo.\n\nLembre-se:\n- Ninguém nasce sabendo\n- Consistência vence talento\n- Você está em Luanda, mas pode competir com o mundo\n\nContinue. Qual é o seu próximo passo?';
 return 'Excelente pergunta. O sucesso em tecnologia vem de três pilares: conhecimento consistente, prática diária e mentalidade de crescimento.\n\nMe conte mais sobre seu objetivo que eu crio um plano passo a passo para você.';
}
function enviar(){
 const t=input.value.trim(); if(!t) return;
 addMsg(t,'user'); input.value='';
 setTimeout(()=>{addMsg(responder(t),'bot')},600);
}
</script>
</body>
</html>
