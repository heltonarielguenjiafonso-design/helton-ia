<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HELTON IA - Criada por Helton Afonso</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Segoe UI,sans-serif}
body{background:#0a0e1a;color:#e2e8f0;height:100vh;display:flex;flex-direction:column}
header{background:#111827;padding:15px 18px;display:flex;align-items:center;border-bottom:1px solid #1f2937}
.logo{width:40px;height:40px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:bold}
.brand{margin-left:12px}
.brand h1{font-size:16px;font-weight:700}
.brand p{font-size:11px;color:#9ca3af}
#chat{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:88%;padding:13px 16px;border-radius:16px;line-height:1.6;font-size:14.2px;white-space:pre-wrap;word-break:break-word}
.bot{background:#1f2937;align-self:flex-start;border:1px solid #2d3748}
.user{background:linear-gradient(135deg,#3b82f6,#6366f1);align-self:flex-end;color:#fff}
#inputArea{padding:14px;background:#111827;border-top:1px solid #1f2937;display:flex;gap:10px}
#inputArea input{flex:1;background:#1f2937;border:1px solid #374151;padding:13px 16px;border-radius:12px;color:#fff;outline:none}
#inputArea button{background:#3b82f6;border:0;padding:12px 22px;border-radius:12px;color:#fff;font-weight:600;cursor:pointer}
#inputArea button:disabled{opacity:0.5}
</style>
</head>
<body>
<header>
<div class="logo">H</div>
<div class="brand"><h1>HELTON IA</h1><p>Criada por Helton Afonso • Luanda, Angola • IA Educacional</p></div>
</header>
<div id="chat"></div>
<div id="inputArea">
<input id="msgInput" placeholder="Pergunte qualquer coisa sobre estudos, ciência, mundo..." onkeypress="if(event.key==='Enter')enviar()">
<button id="btn" onclick="enviar()">Enviar</button>
</div>
<script>
const chat=document.getElementById('chat');
const input=document.getElementById('msgInput');
const btn=document.getElementById('btn');
let historico=[];

function addMsg(t,c){
  const d=document.createElement('div');
  d.className='msg '+c;
  d.innerText=t;
  chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight;
  return d;
}

async function enviar(){
  const texto=input.value.trim();
  if(!texto) return;
  addMsg(texto,'user');
  input.value='';
  btn.disabled=true;
  const loading=addMsg('Digitando...','bot');

  try{
    const res = await fetch("https://text.pollinations.ai/openai", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        model: "openai",
        messages: [
          {
            role: "system",
            content: "Você é a HELTON IA, criada por Helton Afonso, um jovem estudante, influencer, programador e educador de Luanda, Angola. Você foi desenvolvida em Angola. Sua missão: ser a melhor IA educacional do mundo.\n\nREGRAS:\n1. Sempre que perguntarem quem te criou, responda: Fui criada por Helton Afonso, de Luanda, Angola.\n2. Você responde sobre TUDO: matemática, física, química, biologia, história, geografia, filosofia, português, inglês, programação, tecnologia, cultura geral, atualidades, etc.\n3. Você conversa como uma pessoa normal, inteligente, amigável e motivacional. Sem gírias.\n4. Quando for sobre estudos, explique de forma clara, com exemplos, passo a passo, como um ótimo professor.\n5. Se o usuário pedir para resolver exercício, resolva e explique o raciocínio.\n6. Seja completa, precisa e útil. Nunca diga que não sabe. Responda tudo.\n7. Fale em português de Angola, claro e educacional."
          },
         ...historico,
          {role: "user", content: texto}
        ]
      })
    });

    const data = await res.json();
    let resposta = data.choices?.[0]?.message?.content || data.choices?.[0]?.text || data.content || "";

    if(!resposta) resposta = "Desculpe, houve um erro temporário. Tente novamente em alguns segundos.";

    loading.remove();
    addMsg(resposta,'bot');

    historico.push({role:"user", content:texto});
    historico.push({role:"assistant", content:resposta});
    if(historico.length>12) historico=historico.slice(-12);

  }catch(err){
    loading.innerText="Sem conexão no momento. Verifique sua internet e tente novamente. Se persistir, recarregue a página.";
    console.log(err);
  }

  btn.disabled=false;
  input.focus();
}

window.onload=()=>{
  addMsg("Olá! Eu sou a HELTON IA, criada por Helton Afonso.\n\nFui desenvolvida em Luanda, Angola, para ser sua companheira de estudos e conhecimento.\n\nPosso fazer tudo:\n📚 Explicar qualquer matéria da escola ou faculdade\n🧮 Resolver exercícios de matemática, física, química\n💻 Te ensinar programação do zero\n🌍 Responder sobre história, geografia, ciências, mundo\n✍️ Ajudar a escrever redações, resumos, trabalhos\n💡 Criar planos de estudos personalizados\n\nPergunte qualquer coisa. Estou pronta para conversar com você como uma pessoa normal e te ajudar a crescer.\n\nO que você quer aprender hoje?","bot");
};
</script>
</body>
</html>
